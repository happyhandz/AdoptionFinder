plugins {
    id 'com.android.application'
}

android {
    namespace 'app.adoptionfinder'
    compileSdk 34

    defaultConfig {
        applicationId 'app.adoptionfinder'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}
